name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "jsonschema>=4,<5" "pyyaml>=5.1"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      # The scripts are rendered for one tracker; the suite runs against each render.
      - name: suite against the br render
        run: python -m unittest discover -v -s tests/sc-plan-anchor
      - name: suite against the bd render
        run: python -m unittest discover -v -s tests/sc-plan-anchor
        env:
          PLAN_ANCHOR_TEST_TRACKER: bd
      - run: python scripts/check_version_sync.py
      - if: github.event_name == 'pull_request'
        run: python scripts/check_version_sync.py --base origin/${{ github.base_ref }}

  dependency-floor:
    # Proves the stdlib-only scripts work without PyYAML (settings tests skip
    # with a reason) and that anchor tracker selection works on the PyYAML floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install "jsonschema>=4,<5"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: suite without PyYAML
        run: python -m unittest discover -v -s tests/sc-plan-anchor
      - name: suite without PyYAML (bd render)
        run: python -m unittest discover -v -s tests/sc-plan-anchor
        env:
          PLAN_ANCHOR_TEST_TRACKER: bd
      - run: python -m pip install "pyyaml==5.1"
      - name: suite on the PyYAML floor
        run: python -m unittest discover -v -s tests/sc-plan-anchor
      - name: suite on the PyYAML floor (bd render)
        run: python -m unittest discover -v -s tests/sc-plan-anchor
        env:
          PLAN_ANCHOR_TEST_TRACKER: bd

  installer:
    # sc-compose 1.7.0 publishes CPython 3.11 wheels; the rendering, install and
    # history-migration tests need it and fail here instead of skipping.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAN_ANCHOR_REQUIRE_SC_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4,<5" "pyyaml>=5.1" "sc-compose>=1.7.0,<2"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/gen_install_data.py --check
      - name: suite against the br render
        run: python -m unittest discover -v -s tests/sc-plan-anchor
      - name: suite against the bd render
        run: python -m unittest discover -v -s tests/sc-plan-anchor
        env:
          PLAN_ANCHOR_TEST_TRACKER: bd

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "scripts/build-examples.py"
      - "plugins/sc-plan-anchor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Derived pages are build artifacts: generated here from the committed
      # sources, never committed, so the deployed site cannot go stale.
      - name: Build site indexes
        run: python3 scripts/build-site.py
      # Examples are rebuilt from their checked-in inputs with the current scripts (offline, fixture answers),
      # so a deployed example always matches the code. The render needs the sc-compose CLI, as the tests do.
      - name: Install pinned sc-compose CLI
        run: python3 scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build examples
        run: python3 scripts/build-examples.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages intermittently reports "Found 0 artifact(s)" immediately
      # after a successful upload (observed 2 of 4 runs). A single guarded retry
      # absorbs it; the second step is authoritative.
      - uses: actions/deploy-pages@v4
        id: deployment_attempt
        continue-on-error: true
      - name: Settle artifact visibility
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment
